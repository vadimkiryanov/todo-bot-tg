services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - TZ=Europe/Moscow
      - POSTGRES_USER=todobot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      - POSTGRES_DB=todobot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todobot"]
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL не задан}
      - HTTP_ADDR=:8080
      - SESSION_TTL=${SESSION_TTL:-720h}
      - FILES_DIR=/app/data/files
    volumes:
      - files:/app/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10

  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL не задан}
      - FILES_DIR=/app/data/files
    volumes:
      - files:/app/data/files
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # username бота (без @) — включает кнопку «Вход через Telegram»; пусто — скрыта
        VITE_TG_LOGIN: ${VITE_TG_LOGIN:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Домен (например, todo.example.com) — авто-HTTPS; ":80" — просто HTTP
      - APP_BASE_URL=${APP_BASE_URL:-:80}
    volumes:
      # Кэш Caddy (сертификаты Let's Encrypt) — переживает пересборки,
      # иначе каждый up -d --build запрашивает новый сертификат (rate limit!)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
