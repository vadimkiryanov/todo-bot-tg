services:
  bot:
    build: .
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL не задан}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todobot
      POSTGRES_PASSWORD: todobot
      POSTGRES_DB: todobot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todobot"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  pgdata:
